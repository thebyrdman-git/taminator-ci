# Taminator Intelligence - Docker Compose
# 
# Quick deployment for TAMs who want to run as a service

version: '3.8'

services:
  taminator-intelligence:
    build:
      context: .
      dockerfile: Containerfile
    image: taminator-intelligence:2.1.0
    container_name: taminator-intelligence
    restart: unless-stopped
    
    ports:
      - "8080:8080"
    
    volumes:
      # Persist database
      - taminator-data:/app/data
      
    environment:
      - TAMINATOR_DB_PATH=/app/data/intelligence.db
      - PYTHONUNBUFFERED=1
    
    healthcheck:
      test: ["CMD", "python3", "-c", "from taminator.core.database import get_intelligence_database; db = get_intelligence_database(); print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits (prevent runaway processes)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  taminator-data:
    driver: local

