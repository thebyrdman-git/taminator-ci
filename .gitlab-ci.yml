# GitLab CI/CD for Taminator Documentation Site
# Deploys to GitHub Pages with custom domain: taminator.dev

image: python:3.11

stages:
  - test
  - deploy

# Cache pip packages for faster builds
cache:
  paths:
    - .cache/pip

before_script:
  - pip install --cache-dir .cache/pip mkdocs-material mkdocs-minify-plugin mkdocs-git-revision-date-localized-plugin

# Test builds on all branches
test_docs:
  stage: test
  script:
    - mkdocs build
  except:
    - main

# Deploy to GitHub Pages (main branch only)
deploy_github_pages:
  stage: deploy
  script:
    - mkdocs build
    # Configure git for deployment
    - git config --global user.email "ci@taminator.dev"
    - git config --global user.name "Taminator CI"
    # Add GitHub remote with token
    - git remote add github-deploy https://${GITHUB_TOKEN}@github.com/thebyrdman-git/taminator.git
    # Deploy to GitHub Pages
    - mkdocs gh-deploy --force --remote-name github-deploy --remote-branch gh-pages
  only:
    - main
  # Requires: GitHub token with repo permissions
  # Set in GitLab: Settings → CI/CD → Variables
  # Variable: GITHUB_TOKEN
