---
# Taminator Release Automation - GitLab Production Release
# 
# This playbook pushes code and creates release on Red Hat GitLab
# Run this AFTER GitHub staging has been tested

- name: Release Taminator to Red Hat GitLab
  hosts: localhost
  connection: local
  gather_facts: yes
  
  vars:
    project_root: "{{ playbook_dir | dirname }}"
    version: "2.0.0"
    release_log: "{{ project_root }}/release-gitlab-{{ ansible_date_time.iso8601_basic_short }}.log"
    dist_dir: "{{ project_root }}/gui/dist"
    remote: "origin"
  
  tasks:
    - name: Create release log
      copy:
        content: |
          Taminator v{{ version }} - GitLab Production Release
          Date: {{ ansible_date_time.iso8601 }}
          Host: {{ ansible_hostname }}
          User: {{ ansible_user_id }}
          Remote: {{ remote }}
          ================================================================================
        dest: "{{ release_log }}"
    
    - name: Check git status
      command: git status --porcelain
      args:
        chdir: "{{ project_root }}"
      register: git_status
      changed_when: false
    
    - name: Verify working directory clean
      assert:
        that:
          - git_status.stdout == ""
        fail_msg: "❌ RELEASE FAILED: Working directory not clean"
        success_msg: "✅ Working directory clean"
    
    - name: Log git status
      lineinfile:
        path: "{{ release_log }}"
        line: "✅ Git status: Clean"
    
    - name: Check remote exists
      command: git remote get-url {{ remote }}
      args:
        chdir: "{{ project_root }}"
      register: remote_check
      changed_when: false
    
    - name: Verify GitLab remote
      assert:
        that:
          - "'gitlab.cee.redhat.com' in remote_check.stdout"
        fail_msg: "❌ RELEASE FAILED: Not Red Hat GitLab remote"
        success_msg: "✅ Red Hat GitLab remote verified"
    
    - name: Log remote
      lineinfile:
        path: "{{ release_log }}"
        line: "Remote: {{ remote_check.stdout }}"
    
    - name: Final pre-push audit
      command: git ls-files
      args:
        chdir: "{{ project_root }}"
      register: tracked_files
      changed_when: false
    
    - name: Check for customer data
      shell: echo "{{ tracked_files.stdout }}" | grep -iE "(jpmc|jpmchase|ganesh|334224|04293185)" || true
      register: customer_data_final
      changed_when: false
    
    - name: Verify no customer data
      assert:
        that:
          - customer_data_final.stdout == ""
        fail_msg: "❌ RELEASE BLOCKED: Customer data found in tracked files"
        success_msg: "✅ No customer data in tracked files"
    
    - name: Log audit
      lineinfile:
        path: "{{ release_log }}"
        line: "✅ Final audit: No customer data"
    
    - name: Push to GitLab
      command: git push {{ remote }} main
      args:
        chdir: "{{ project_root }}"
      register: push_result
    
    - name: Log push result
      lineinfile:
        path: "{{ release_log }}"
        line: "✅ Pushed to {{ remote }}/main"
    
    - name: Push tag to GitLab
      command: git push {{ remote }} v{{ version }}
      args:
        chdir: "{{ project_root }}"
      register: tag_push
    
    - name: Log tag push
      lineinfile:
        path: "{{ release_log }}"
        line: "✅ Pushed tag v{{ version }} - GitLab CI/CD pipeline will now build artifacts"
    
    - name: Wait for GitLab CI/CD pipeline to trigger
      pause:
        prompt: |
          
          ================================================================================
          GITLAB CI/CD PIPELINE TRIGGERED
          ================================================================================
          
          The tag v{{ version }} has been pushed to GitLab.
          MiracleMax self-hosted runner will now:
          
          1. Build Linux x86_64 AppImage
          2. Build Linux ARM64 AppImage (QEMU emulation)
          3. Create GitLab release automatically
          
          Monitor pipeline at:
          https://gitlab.cee.redhat.com/jbyrd/taminator/-/pipelines
          
          Press ENTER to continue monitoring...
        seconds: 5
    
    - name: Get latest pipeline status
      uri:
        url: "https://gitlab.cee.redhat.com/api/v4/projects/jbyrd%2Ftaminator/pipelines?ref=v{{ version }}"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ lookup('env', 'GITLAB_TOKEN') }}"
        return_content: yes
      register: pipeline_status
      until: pipeline_status.json[0].status in ['success', 'failed', 'canceled']
      retries: 60
      delay: 30
      when: lookup('env', 'GITLAB_TOKEN') != ""
      ignore_errors: yes
    
    - name: Final release summary
      lineinfile:
        path: "{{ release_log }}"
        line: |
          
          ================================================================================
          GITLAB RELEASE SUMMARY
          ================================================================================
          Status: ✅ SUCCESS
          Version: v{{ version }}
          Remote: {{ remote_check.stdout }}
          Branch: main
          Tag: v{{ version }}
          
          CI/CD Pipeline: https://gitlab.cee.redhat.com/jbyrd/taminator/-/pipelines
          Release Page: https://gitlab.cee.redhat.com/jbyrd/taminator/-/releases/v{{ version }}
          
          MiracleMax Self-Hosted Runner will build:
          - Linux x86_64 AppImage (native build)
          - Linux ARM64 AppImage (QEMU emulation)
          
          GitLab will automatically:
          - Create release from tag v{{ version }}
          - Attach build artifacts
          - Generate release notes
          
          Announcement:
          - Slack: #taminator-intelligence
          - Email: TAM team
          - Wiki: Update internal documentation
          ================================================================================
    
    - name: Display release results
      debug:
        msg:
          - "✅ GITLAB PRODUCTION RELEASE TRIGGERED"
          - ""
          - "Version: v{{ version }}"
          - "Remote: {{ remote_check.stdout }}"
          - ""
          - "MiracleMax self-hosted runner is building:"
          - "  - Linux x86_64 AppImage (native)"
          - "  - Linux ARM64 AppImage (QEMU)"
          - ""
          - "Monitor pipeline:"
          - "https://gitlab.cee.redhat.com/jbyrd/taminator/-/pipelines"
          - ""
          - "Release will be available at:"
          - "https://gitlab.cee.redhat.com/jbyrd/taminator/-/releases/v{{ version }}"
          - ""
          - "Release log: {{ release_log }}"

