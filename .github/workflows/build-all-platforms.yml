name: Build Taminator v2.0 - All Platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux-x64:
    name: Build Linux x86_64
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-service.txt
          pip install pyinstaller

      - name: Build service binary
        run: |
          cd ${{ github.workspace }}
          PYTHONPATH=src python3 -m PyInstaller taminator-service.spec --clean
          ls -lh dist/taminator-service

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build Linux x64 AppImage
        working-directory: gui
        run: npm run build

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taminator-linux-x64
          path: |
            gui/dist/*.AppImage
            gui/dist/*.deb
            gui/dist/*.rpm
          retention-days: 30

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ARM64 using Docker buildx
        run: |
          # Install buildx if not present
          docker buildx version || echo "Buildx already installed"

          # Create multi-arch builder
          docker buildx create --name multiarch --use || docker buildx use multiarch

          # Build ARM64 AppImage in container
          docker buildx build \
            --platform linux/arm64 \
            --file Dockerfile.arm64 \
            --output type=local,dest=./arm64-output \
            .

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taminator-linux-arm64
          path: arm64-output/*.AppImage
          retention-days: 30

  build-macos:
    name: Build macOS (Universal)
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for macOS cross-compile support
        run: |
          echo "⚠️  Note: macOS build requires either:"
          echo "  1. Native macOS runner (recommended)"
          echo "  2. OSXCross toolchain on Linux"
          echo "  3. Electron Forge with proper signing"
          echo ""
          echo "For now, this job will create a placeholder."

      - name: Create macOS build placeholder
        run: |
          mkdir -p macos-output
          echo "macOS build requires native macOS hardware or OSXCross" > macos-output/README.txt
          echo "Download x64 Linux build and use electron-forge on macOS to create DMG" >> macos-output/README.txt

      - name: Upload macOS placeholder
        uses: actions/upload-artifact@v4
        with:
          name: taminator-macos-placeholder
          path: macos-output/*
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Windows cross-compile support
        run: |
          echo "⚠️  Note: Windows build requires either:"
          echo "  1. Native Windows runner with NSIS (recommended)"
          echo "  2. Wine + electron-builder on Linux"
          echo "  3. GitHub Windows runner (costs money)"
          echo ""
          echo "For now, this job will create a placeholder."

      - name: Create Windows build placeholder
        run: |
          mkdir -p windows-output
          echo "Windows build requires Windows hardware or Wine setup" > windows-output/README.txt
          echo "Download x64 Linux build and use electron-builder on Windows to create installer" >> windows-output/README.txt

      - name: Upload Windows placeholder
        uses: actions/upload-artifact@v4
        with:
          name: taminator-windows-placeholder
          path: windows-output/*
          retention-days: 30

  create-release:
    name: Create Release Summary
    runs-on: self-hosted
    needs: [build-linux-x64, build-linux-arm64, build-macos, build-windows]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release summary
        run: |
          echo "# Taminator v2.0 Tesla Architecture - Build Summary" > release-summary.md
          echo "" >> release-summary.md
          echo "**Build Date**: $(date)" >> release-summary.md
          echo "**Commit**: ${{ github.sha }}" >> release-summary.md
          echo "" >> release-summary.md
          echo "## Available Builds" >> release-summary.md
          echo "" >> release-summary.md

          # List all artifacts
          cd release-artifacts
          for dir in */; do
            echo "### ${dir%/}" >> ../release-summary.md
            ls -lh "$dir" >> ../release-summary.md
            echo "" >> ../release-summary.md
          done

          cd ..
          cat release-summary.md

      - name: Upload release summary
        uses: actions/upload-artifact@v4
        with:
          name: release-summary
          path: release-summary.md
          retention-days: 30

